name: Build Random Telegram X APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Generate random app identity
        id: identity
        run: |
          RAND=$(shuf -i 1000-9999 -n 1)
          NAMES=("Galaxy" "Nova" "Pixel" "Comet" "Nebula" "Orbit" "Pulsar" "Quasar" "Zenith" "Aurora")
          IDX=$(( RANDOM % 10 ))
          APP_NAME="${NAMES[$IDX]} $RAND"
          PKG_SUFFIX=$(openssl rand -hex 3)
          APP_ID="org.tgx.app.${PKG_SUFFIX}"
          echo "APP_NAME=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "APP_ID=${APP_ID}" >> $GITHUB_OUTPUT
          echo "App: ${APP_NAME} | ID: ${APP_ID}"

      - name: Clone Telegram X source
        run: |
          git clone --depth=1 https://github.com/TGX-Android/Telegram-X.git tgx
          cd tgx
          git submodule update --init --recursive --depth=1

      - name: Setup Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH
          java -version

      - name: Install NDK and CMake
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          sdkmanager --install "ndk;21.4.7075529" "cmake;3.22.1" 2>&1 | tail -5

      - name: Setup local.properties
        working-directory: tgx
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties
          cat local.properties

      - name: Patch app name and package
        working-directory: tgx
        env:
          APP_NAME: ${{ steps.identity.outputs.APP_NAME }}
          APP_ID: ${{ steps.identity.outputs.APP_ID }}
        run: |
          XML=$(find app/src -name "strings.xml" | head -1)
          if [ -n "$XML" ]; then
            sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">${APP_NAME}</string>|g" "$XML"
          fi
          if [ -f app/build.gradle.kts ]; then
            sed -i "s|applicationId = \"org\.thunderdog\.challegram\"|applicationId = \"${APP_ID}\"|g" app/build.gradle.kts
          elif [ -f app/build.gradle ]; then
            sed -i "s|applicationId \"org\.thunderdog\.challegram\"|applicationId \"${APP_ID}\"|g" app/build.gradle
          fi
          echo "Patch: ${APP_NAME} / ${APP_ID}"

      - name: Build Debug APK
        working-directory: tgx
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -80

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TGX-APK
          path: tgx/app/build/outputs/apk/debug/*.apk
          retention-days: 30