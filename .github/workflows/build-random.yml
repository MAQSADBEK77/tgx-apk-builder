name: Build Random Telegram X APK

on:
  workflow_dispatch:
    inputs:
      custom_name:
        description: 'Ilov nomi (bo`sh qolsa random bo`ladi)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Generate random app identity
        id: identity
        run: |
          # Random 4 xonali raqam
          RAND=$(shuf -i 1000-9999 -n 1)

          # Custom nom berilmagan bo'lsa random nom
          if [ -z "${{ github.event.inputs.custom_name }}" ]; then
            NAMES=("Galaxy" "Nova" "Pixel" "Comet" "Nebula" "Orbit" "Pulsar" "Quasar" "Zenith" "Aurora")
            NAME=${NAMES[$RANDOM % ${#NAMES[@]}]}
            APP_NAME="${NAME} ${RAND}"
          else
            APP_NAME="${{ github.event.inputs.custom_name }}"
          fi

          PKG_SUFFIX=$(python3 -c "import random,string; print(''.join(random.choices(string.ascii_lowercase,k=6)))")
          APP_ID="org.tgx.app.${PKG_SUFFIX}"

          echo "APP_NAME=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "APP_ID=${APP_ID}" >> $GITHUB_OUTPUT
          echo "RAND=${RAND}" >> $GITHUB_OUTPUT

          echo "App nomi: ${APP_NAME}"
          echo "Package ID: ${APP_ID}"

      - name: Clone Telegram X source
        run: |
          git clone --depth=1 https://github.com/TGX-Android/Telegram-X.git tgx
          cd tgx
          git submodule update --init --recursive --depth=1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;21.4.7075529" "cmake;3.22.1"

      - name: Setup local.properties
        working-directory: tgx
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties

          # Telegram API credentials (GitHub Secrets dan olish)
          if [ -n "${{ secrets.TELEGRAM_API_ID }}" ]; then
            echo "APP_ID=${{ secrets.TELEGRAM_API_ID }}" >> local.properties
            echo "APP_HASH=${{ secrets.TELEGRAM_API_HASH }}" >> local.properties
          fi

      - name: Patch app name
        working-directory: tgx
        env:
          APP_NAME: ${{ steps.identity.outputs.APP_NAME }}
          APP_ID: ${{ steps.identity.outputs.APP_ID }}
        run: |
          # App nomini o'zgartirish
          find app/src -name "strings.xml" | head -1 | xargs -I{} \
            sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">${APP_NAME}</string>|g" {}

          # Package ID ni o'zgartirish (build.gradle)
          sed -i "s|applicationId.*\"org\.thunderdog\.challegram\"|applicationId \"${APP_ID}\"|g" \
            app/build.gradle.kts 2>/dev/null || \
          sed -i "s|applicationId.*\"org\.thunderdog\.challegram\"|applicationId \"${APP_ID}\"|g" \
            app/build.gradle 2>/dev/null || true

          echo "Patch qilindi: ${APP_NAME} / ${APP_ID}"

      - name: Build Debug APK
        working-directory: tgx
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Find and rename APK
        id: apk
        working-directory: tgx
        env:
          APP_NAME: ${{ steps.identity.outputs.APP_NAME }}
        run: |
          APK_PATH=$(find . -name "*.apk" -path "*/debug/*" | head -1)
          SAFE_NAME=$(echo "$APP_NAME" | tr ' ' '_')
          NEW_NAME="${SAFE_NAME}.apk"
          cp "$APK_PATH" "../${NEW_NAME}"
          echo "APK_FILE=${NEW_NAME}" >> $GITHUB_OUTPUT
          echo "APK topildi: ${APK_PATH}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.APP_NAME }}
          path: ${{ steps.apk.outputs.APK_FILE }}
          retention-days: 30

      - name: Build summary
        run: |
          echo "## ✅ Build muvaffaqiyatli!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Ilova nomi** | ${{ steps.identity.outputs.APP_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package ID** | ${{ steps.identity.outputs.APP_ID }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Fayl** | ${{ steps.apk.outputs.APK_FILE }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK ni **Artifacts** bo'limidan yuklab oling" >> $GITHUB_STEP_SUMMARY
